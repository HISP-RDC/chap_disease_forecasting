schema_version: 2

# `chap-admin` requires id == service_id with "-" replaced by "_", and
# service_id == MLServiceInfo.id reported by the running container.
id: chap_disease_forecasting
service_id: chap-disease-forecasting
display_name: Weekly Disease Forecast (Gradient Boosting)
kind: model

# The author's own chapkit AssessedStatus, copied from the service.
assessed_status: orange

summary: >-
  Weekly case forecasts for climate-sensitive diseases such as malaria and
  cholera, up to 12 weeks ahead (as many weeks as CHAP requests). One
  gradient-boosting estimator per horizon (XGBoost or LightGBM, Tweedie
  objective) on strictly causal features: case history and growth, current
  and lagged rainfall and temperature with anomalies, and the incidence of
  each location's nearest neighbours when CHAP sends the polygons.
  best_of_both picks the engine from rolling-origin out-of-sample scores
  only. Predictive samples come from out-of-sample errors on the log scale,
  so ranges scale with the case level; they are not claimed to be calibrated.

developed_for: >-
  Weekly malaria and cholera surveillance at health-zone level in the
  Democratic Republic of the Congo (514 zones). Tested end to end on synthetic
  data only; not yet validated on real surveillance data.

source:
  repository: https://github.com/HISP-RDC/chap_disease_forecasting
  # Registry paths must be lowercase: chap-admin and the marketplace validator
  # reject uppercase, and GHCR publishes ghcr.io/hisp-rdc/... anyway.
  image: ghcr.io/hisp-rdc/chap_disease_forecasting
  runtime_image: ghcr.io/dhis2-chap/chapkit-py

# Copied from MLServiceInfo.model_metadata (a test keeps them equal).
attribution:
  author: HISP DRC engineering team
  organization: HISP DRC

maintainers:
  [{ name: "Ebed Meleck Makoso", email: "ebedmeleckmakoso@gmail.com" }]

compatibility:
  period_types: [weekly]
  min_prediction_periods: 1
  max_prediction_periods: 12
  requires_geo: false

covariates:
  required: [rainfall, mean_temperature, population]
  defaults: []
  allow_free_additional: false

# Filled by deploy/pin_release.py once CI has published the image and the
# acceptance tests in docs/PRODUCTION_DEPLOYMENT.md have passed. Until then
# `chap-admin install` refuses the entry ("no verified stable version").
channels: {}
versions: []

# Each configuration becomes one configured model in CHAP, named
# "chap-disease-forecasting:<key>". The Modeling App lists it as
# "<display_name> [<Key>]", with underscores as spaces and only the first
# letter capitalised (e.g. "[Best of both]"), so keys are chosen to read well.
# prediction_periods is required by the marketplace schema; chap-admin drops
# it because CHAP sets the horizon for each run.
configurations:
  xgboost:
    description: >-
      Gradient-boosted trees with XGBoost, one model per forecast week.
    config:
      prediction_periods: 3
      engine: xgboost
  lightgbm:
    description: >-
      Gradient-boosted trees with LightGBM, one model per forecast week.
    config:
      prediction_periods: 3
      engine: lightgbm
  best_of_both:
    description: >-
      Trains XGBoost and LightGBM and keeps whichever forecast past weeks more
      accurately. Keeps XGBoost when there is too little history to compare
      them, and records the choice with each forecast.
    config:
      prediction_periods: 3
      engine: auto
      auto_mode: select
